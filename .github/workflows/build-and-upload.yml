name: Build and Upload to Supabase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.24.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux-amd64
          - os: ubuntu-latest
            arch: arm64
            platform: linux-arm64
          - os: macos-latest
            arch: amd64
            platform: darwin-amd64
          - os: macos-latest
            arch: arm64
            platform: darwin-arm64
          - os: windows-latest
            arch: amd64
            platform: windows-amd64
          - os: windows-latest
            arch: arm64
            platform: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -ldflags="-s -w" -o mcp-remote-go-${{ matrix.platform }}.exe .
          else
            go build -ldflags="-s -w" -o mcp-remote-go-${{ matrix.platform }} .
          fi

      - name: Create checksums
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            sha256sum mcp-remote-go-${{ matrix.platform }}.exe > mcp-remote-go-${{ matrix.platform }}.exe.sha256
          else
            sha256sum mcp-remote-go-${{ matrix.platform }} > mcp-remote-go-${{ matrix.platform }}.sha256
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Upload to Supabase Storage
        run: |
          # Set up Supabase CLI with access token
          export SUPABASE_ACCESS_TOKEN="${{ secrets.SUPABASE_ACCESS_TOKEN }}"
          export PROJECT_ID="${{ secrets.SUPABASE_PROJECT_ID }}"
          
          # Upload files to Supabase Storage using CLI
          if [ "${{ runner.os }}" = "Windows" ]; then
            supabase storage upload releases/${{ github.ref_name }}/mcp-remote-go-${{ matrix.platform }}.exe mcp-remote-go-${{ matrix.platform }}.exe --project-ref $PROJECT_ID
            supabase storage upload releases/${{ github.ref_name }}/mcp-remote-go-${{ matrix.platform }}.exe.sha256 mcp-remote-go-${{ matrix.platform }}.exe.sha256 --project-ref $PROJECT_ID
          else
            supabase storage upload releases/${{ github.ref_name }}/mcp-remote-go-${{ matrix.platform }} mcp-remote-go-${{ matrix.platform }} --project-ref $PROJECT_ID
            supabase storage upload releases/${{ github.ref_name }}/mcp-remote-go-${{ matrix.platform }}.sha256 mcp-remote-go-${{ matrix.platform }}.sha256 --project-ref $PROJECT_ID
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-remote-go-${{ matrix.platform }}
          path: |
            mcp-remote-go-${{ matrix.platform }}*
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release archive
        run: |
          mkdir -p release
          find ./artifacts -name "mcp-remote-go-*" -not -name "*.sha256" -exec cp {} ./release/ \;
          find ./artifacts -name "*.sha256" -exec cp {} ./release/ \;
          cd release
          tar -czf ../mcp-remote-go-${{ github.ref_name }}.tar.gz *
          cd ..
          zip -r mcp-remote-go-${{ github.ref_name }}.zip release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mcp-remote-go-${{ github.ref_name }}.tar.gz
            mcp-remote-go-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build, create-release]
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.build.result == 'success'
        run: |
          echo "✅ Build completed successfully for all platforms"
          echo "📦 Artifacts uploaded to Supabase Storage"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "🚀 Main branch build completed"
          fi

      - name: Notify Failure
        if: needs.build.result == 'failure'
        run: |
          echo "❌ Build failed for one or more platforms"
          exit 1
