name: Build and Upload to Supabase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            platform: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
            platform: windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w" -o mcp-remote-go-${{ matrix.platform }}.exe .
          else
            go build -ldflags="-s -w" -o mcp-remote-go-${{ matrix.platform }} .
          fi

      - name: Create checksums
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum mcp-remote-go-${{ matrix.platform }}.exe > mcp-remote-go-${{ matrix.platform }}.exe.sha256
          else
            sha256sum mcp-remote-go-${{ matrix.platform }} > mcp-remote-go-${{ matrix.platform }}.sha256
          fi

      - name: Upload to Supabase Storage
        shell: bash
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_FILE="mcp-remote-go-${{ matrix.platform }}.exe"
            CHECKSUM_FILE="mcp-remote-go-${{ matrix.platform }}.exe.sha256"
          else
            BINARY_FILE="mcp-remote-go-${{ matrix.platform }}"
            CHECKSUM_FILE="mcp-remote-go-${{ matrix.platform }}.sha256"
          fi
          
          curl -X POST \
            "${SUPABASE_URL}/storage/v1/object/releases/${REF_NAME}/${BINARY_FILE}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${BINARY_FILE}"
          
          curl -X POST \
            "${SUPABASE_URL}/storage/v1/object/releases/${REF_NAME}/${CHECKSUM_FILE}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: text/plain" \
            --data-binary @"${CHECKSUM_FILE}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-remote-go-${{ matrix.platform }}
          path: |
            mcp-remote-go-${{ matrix.platform }}*
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release archive
        run: |
          mkdir -p release
          find ./artifacts -name "mcp-remote-go-*" -not -name "*.sha256" -exec cp {} ./release/ \;
          find ./artifacts -name "*.sha256" -exec cp {} ./release/ \;
          cd release
          tar -czf ../mcp-remote-go-${{ github.ref_name }}.tar.gz *
          cd ..
          zip -r mcp-remote-go-${{ github.ref_name }}.zip release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mcp-remote-go-${{ github.ref_name }}.tar.gz
            mcp-remote-go-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build, create-release]
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.build.result == 'success'
        run: |
          echo "✅ Build completed successfully for all platforms"
          echo "📦 Artifacts uploaded to Supabase Storage"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "🚀 Main branch build completed"
          fi

      - name: Notify Failure
        if: needs.build.result == 'failure'
        run: |
          echo "❌ Build failed for one or more platforms"
          exit 1
